name: "An app doesn't work / Una app no funciona"
description: "A Windows program doesn't install, open or work correctly / Un programa de Windows no instala, no abre o no anda bien"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The easiest way: in Vitral, right-click the app → **Report a Problem…** (or the button Vitral shows when an installation or a program fails). It fills this form in for you, without personal data. Please **don't attach installers** or other copyrighted files.
        ¡Gracias por reportar! Lo más fácil: en Vitral, clic derecho en la app → **Informar un problema…** (o el botón que muestra Vitral cuando falla una instalación o un programa). Llena este formulario por ti, sin datos personales. Por favor **no adjuntes instaladores** ni otros archivos con derechos de autor.
  - type: input
    id: program
    attributes:
      label: "Program and version / Programa y versión"
      placeholder: "Notepad++ 8.6"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened? / ¿Qué pasó?"
      description: "What did you expect, and what did you see? Screenshots of the program window help. / ¿Qué esperabas y qué viste? Las capturas de la ventana del programa ayudan."
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: "Vitral's report / Informe de Vitral"
      description: "Vitral fills this in. Without Vitral's report, paste the output of `vitral report <app>` or `vitral analyze --json <installer>`. / Lo llena Vitral. Si no, pega el resultado de `vitral informe <app>` o `vitral analizar --json <instalador>`."
      render: text
  - type: input
    id: mac
    attributes:
      label: "Mac model, chip and macOS version / Modelo de Mac, chip y versión de macOS"
      placeholder: "MacBook Pro 14\" M1 Pro, macOS 27.2"
    validations:
      required: true
  - type: input
    id: vitral-version
    attributes:
      label: "Vitral version / Versión de Vitral"
      placeholder: "vitral version"

name: "An app doesn't work / Una app no funciona"
description: "A Windows program doesn't install or open correctly / Un programa de Windows no instala o no abre bien"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't attach installers** or other copyrighted files.
        ¡Gracias por reportar! Por favor **no adjuntes instaladores** ni otros archivos con derechos de autor.
  - type: input
    id: program
    attributes:
      label: "Program and version / Programa y versión"
      placeholder: "Notepad++ 8.6"
    validations:
      required: true
  - type: textarea
    id: analysis
    attributes:
      label: "Output of `vitral analyze --json` / Resultado de `vitral analizar --json`"
      render: json
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened? / ¿Qué pasó?"
      description: "What did you expect, and what did you see? Screenshots of the program window help. / ¿Qué esperabas y qué viste? Las capturas de la ventana del programa ayudan."
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: "Mac model, chip and macOS version / Modelo de Mac, chip y versión de macOS"
      placeholder: "MacBook Pro 14\" M1 Pro, macOS 27.2"
    validations:
      required: true
  - type: input
    id: vitral-version
    attributes:
      label: "Vitral version / Versión de Vitral"
      placeholder: "vitral version"
